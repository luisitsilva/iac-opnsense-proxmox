---
- name: Configure DNS (Unbound)
  hosts: opnsense
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ ansible_host }}"
      api_credential_file: "{{ api_credential_file }}"

  tasks:
    - name: Configure Unbound general settings
      oxlorg.opnsense.unbound_general:
        enabled: true
        dnssec: true
        dns64: false
        port: 53
        interfaces: [" ", " "]
        outgoing_interfaces: [" "]

    - name: Add DNS host overrides
      oxlorg.opnsense.unbound_host:
        hostname: "{{ item.hostname }}"
        domain: "{{ item.domain }}"
        address: "{{ item.address }}"
        description: "{{ item.description }}"
      loop:
        - { hostname: " ", domain: " ", address: " ", description: "Firewall master" }
        - { hostname: " ", domain: " ", address: " ", description: "Firewall backup" }
        - { hostname: " ", domain: " ", address: " ", description: " " }
        - { hostname: " ", domain: " ", address: " ", description: " " }

    - name: Add DNS forwarding servers (DoT)
      oxlorg.opnsense.unbound_forward:
        domain: "."
        server: "{{ item }}"
        port: 
        type: "dot"
      loop:
        - " "
        - " "
