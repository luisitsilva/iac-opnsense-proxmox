---
- name: Configure NAT
  hosts: opnsense
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ ansible_host }}"
      api_credential_file: "{{ api_credential_file }}"

  tasks:
    - name: Configure outbound NAT (SNAT) for LAN
      oxlorg.opnsense.nat_source:
        match_fields: ['description']
        interface: " "
        source_net: " "
        target: " "
        description: " "
        state: present

    - name: Configure destination NAT (port forward) for web server
      oxlorg.opnsense.nat_destination:
        match_fields: ['description']
        interface: [" "]
        protocol: " "
        destination_net: " "  
        destination_port: " "
        target: " "
        local_port: " "
        description: " "
        associated_rule: " "
        state: present

    - name: Configure destination NAT for SSH (restricted)
      oxlorg.opnsense.nat_destination:
        match_fields: ['description']    
        interface: [" "]
        protocol: " "
        destination_net: " "
        destination_port: " "
        target: " "
        local_port: " "
        description: " "
        associated_rule: " "
        state: present
