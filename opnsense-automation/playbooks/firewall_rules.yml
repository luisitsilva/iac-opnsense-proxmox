---
- name: Configure Firewall Rules
  hosts: opnsense
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ ansible_host }}"
      api_credential_file: "{{ api_credential_file }}"
      ssl_verify: false

  tasks:
    - name: Create firewall aliases for zones
      oxlorg.opnsense.alias:
        name: "{{ item.name }}"
        type: "{{ item.type }}"
        content: "{{ item.content }}"
        description: "{{ item.description }}"
      loop:
        - { name: "TRUST_NET", type: "network", content: [" "], description: "Trusted internal networks" }
        - { name: "UNTRUST_NET", type: "network", content: [" "], description: "Untrusted external networks" }
        - { name: "DMZ_NET", type: "network", content: [" "], description: "DMZ networks" }
        - { name: "GUEST_NET", type: "network", content: [" "], description: "Guest networks" }
        - { name: "MGMT_NET", type: "network", content: [" "], description: "Management networks" }

    - name: Create 50 generic firewall rules
      oxlorg.opnsense.rule:
        interface: "{{ item.interface }}"
        action: "{{ item.action }}"
        direction: "{{ item.direction | default('in') }}"
        protocol: "{{ item.protocol | default('any') }}"
        source_net: "{{ item.source_net }}"
        destination_net: "{{ item.destination_net }}"
        destination_port: "{{ item.destination_port | default('') }}"
        description: "{{ item.description }}"
        enabled: 
        log: "{{ item.log | default(false) }}"
        sequence: "{{ item.sequence }}"
      loop:
        # Block known bad actors
        - { interface: "wan", action: "block", source_net: "bogons", destination_net: "any", description: "Block bogon networks", sequence: "1" }
        - { interface: "wan", action: "block", source_net: "private_networks", destination_net: "any", description: "Block private networks on WAN", sequence: "2" }
        
        # Allow established connections
        - { interface: "wan", action: "pass", protocol: "tcp", source_net: "any", destination_net: "any", destination_port: "any", description: "Allow established TCP", sequence: "10" }
        
        # DMZ rules
        - { interface: "dmz", action: " ", protocol: " ", source_net: " ", destination_net: " ", destination_port: " ", description: " ", sequence: " " }
        - { interface: "dmz", action: " ", protocol: " ", source_net: " ", destination_net: " ", destination_port: " ", description: " ", sequence: " " }
        - { interface: "dmz", action: " ", source_net: " ", destination_net: " ", description: " ", sequence: " " }
        
        # Guest network restrictions
        - { interface: "guest", action: " ", protocol: " ", source_net: " ", destination_net: " ", destination_port: " ", description: " ", sequence: "" }
        - { interface: "guest", action: " ", protocol: " ", source_net: " ", destination_net: " ", destination_port: " ", description: " ", sequence: "" }
        - { interface: "guest", action: " ", source_net: " ", destination_net: " ", description: " ", sequence: "" }
        - { interface: "guest", action: " ", source_net: " ", destination_net: " ", description: " ", sequence: "" }
        
        # Trust network rules
        - { interface: "lan", action: " ", protocol: " ", source_net: " ", destination_net: " ", description: " ", sequence: " " }
        - { interface: "lan", action: " ", protocol: " ", source_net: " ", destination_net: " ", destination_port: " ", description: " ", sequence: " " }
        
        # Management access
        - { interface: "lan", action: " ", protocol: " ", source_net: " ", destination_net: " ", destination_port: " ", description: " ", sequence: " " }
        - { interface: "lan", action: " ", source_net: " ", destination_net: " ", description: " ", sequence: " " }
        
        # ICMP rules
        - { interface: "wan", action: " ", protocol: " ", source_net: " ", destination_net: " ", description: " ", sequence: " " }
        
        # Block everything else on WAN
        - { interface: "wan", action: " ", source_net: " ", destination_net: " ", description: " ", sequence: " " }
        # ... (add 35+ more rules following this pattern for your specific services)
